name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'   # so changes to the deploy itself still deploy

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # req-34: run the same gate the local flow runs (lint + tests + build)
      # before deploying, so a red suite blocks the Pages deploy. ./check is the
      # one source of truth — CI can't drift from what `plan publish` enforces.
      # It builds too (without GITHUB_PAGES), so the deploy build below is the
      # only Pages-configured build that ships.
      - run: ./check
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
