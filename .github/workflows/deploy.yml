# req-238 — check-only CI. This no longer deploys anything: GitHub Pages is shut down (DEC-135)
# and the live app ships from Emilio's own server via `./server/deploy`. The file keeps its
# name so the workflow id, `gh workflow enable deploy.yml` and the closeout skill's
# `--workflow deploy.yml` stay the same.
name: CI

on:
  # No paths filter: ./check covers server/**, scripts/** and the skills check reads handoff/,
  # so any push to main can turn it red.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # req-248 (from req-239): a hang goes red in 10 min, not GitHub's 360-min default. ~3x the
    # green run's 2m03s (run 40354463101). ./check's --test-timeout catches an async hang in 60 s;
    # a synchronous one (its 900 s watchdog is longer than this) is caught here.
    timeout-minutes: 10
    steps:
      # req-258: v7 of both (v4 ran on a deprecated Node, forced onto Node 24 — run 40354463101).
      # v5–v7 notes read: no input this job uses (node-version-file, cache) was renamed or removed.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # req-34: the same gate the local flow runs (lint + tests + build). ./check is the one
      # source of truth — CI can't drift from what `plan publish` enforces.
      - run: ./check
      # req-275 (L-071): all six shell suites (plan, check_handoff, skills check, pre-push hook) on
      # every push — ./check runs only those whose subject a local change touched (on main: none).
      - run: bash scripts/shell-suites.sh --all
      # req-159: the core loop by real clicks in headless Chrome (scripts/smoke.mjs) on an
      # isolated build of this commit. Chrome comes from puppeteer's npm ci download; CI=true
      # makes it run --no-sandbox (Ubuntu 23.10+ runners can block Chrome's user-namespace sandbox).
      - run: node scripts/smoke.mjs
